/* Social battery link. Reads a read-only snapshot from the social battery meter.

// Served under /rpg/ of the battery site: same origin, no CORS, and the battery session can be linked automatically.
// Local development only: ?batteryApi=http://localhost:3000 when LifeRPG itself runs standalone on localhost.
const SAME_SITE=/^\/rpg(\/|$)/.test(location.pathname);
const BATTERY_API=(()=>{if(SAME_SITE)return location.origin;const local=/^(localhost|127\.0\.0\.1)$/.test(location.hostname),o=new URLSearchParams(location.search).get('batteryApi');
  return local&&o&&/^http:\/\/(localhost|127\.0\.0\.1)(:\d{1,5})?$/.test(o)?o:'https://social-battery-meter.pages.dev';})();
const AUTO_LINK_OFF='liferpg-battery-autolink-off';

/* On the same site, read the battery session (httpOnly cookie) through /api/link-code and link it once.

const QUIZ_LATER='liferpg-quiz-later';
let quizOffered=false,quizQuestions=null;
async function autoLinkBattery(){
  if(!SAME_SITE||batteryCode()||!autoLinkAllowed()||state?.active)return;
  try{const res=await fetch('/api/link-code',{credentials:'same-origin',cache:'no-store'});
    if(!res.ok)return;
    const body=await res.json();
    // code 為 null：這個瀏覽器還沒做過生活電量快篩，進冒險時就先請玩家做
    if(body?.code===null){offerQuiz();return;}
    if(typeof body?.code!=='string'||batteryCode())return;
    await mutate(s=>{D.setBatteryLink(s,body.code);},!modal.open);}
  catch{}
}

const batteryCode=()=>state?.preferences.socialBattery?.code||null;

const isDate=v=>typeof v==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(v);
async function batteryFetch(path,init={}){const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),init.timeout||8000);
  try{const res=await fetch(BATTERY_API+path,{method:init.method||'GET',headers:init.headers,body:init.body,signal:ctl.signal,credentials:'omit',cache:'no-store'});
    const body=await res.json().catch(()=>null);if(!res.ok||!body||typeof body!=='object')throw new Error(typeof body?.error==='string'?body.error:'電量計暫時連不上');return body;}
  catch(e){if(e.name==='AbortError'||e instanceof TypeError)throw new Error('電量計暫時連不上');throw e;}finally{clearTimeout(timer);}}
async function refreshBattery(){await autoLinkBattery();const code=batteryCode();
  if(!code){battery={code:null,status:'off',data:null,guide:null,guideStatus:'idle',guideKey:'',inflight:false};updateBatteryViews();return;}
  if(code!==battery.code){battery={code,status:'loading',data:null,guide:null,guideStatus:'idle',guideKey:'',inflight:false};updateBatteryViews();}
  if(battery.inflight)return;battery.inflight=true;
  try{const data=await batteryFetch('/api/public/battery?session='+encodeURIComponent(code));if(batteryCode()!==code)return;
    if(!data.today||!Array.isArray(data.week)||!Array.isArray(data.riskDays))throw new Error('電量資料格式不正確');battery.data=data;battery.status='ok';}
  catch{if(batteryCode()===code)battery.status='offline';}
  finally{if(battery.code===code)battery.inflight=false;}
  updateBatteryViews();refreshGuide();}
async function refreshGuide(force=false){const code=battery.code;if(!code||battery.status!=='ok')return;
  // Only goal titles are sent: no notes, tasks or records.
  const goals=state.goals.filter(g=>g.status==='active').slice(0,5).map(g=>g.title);
  const k=[code,D.day(D.now()),pct(battery.data.today.remainingBattery),battery.data.riskDays.length,...goals].join('\n');
  if(!force&&battery.guideKey===k&&battery.guideStatus!=='error')return;
  battery.guideKey=k;battery.guideStatus='loading';updateBatteryViews();
  try{const g=await batteryFetch('/api/guide/today',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session:code,goals}),timeout:25000});
    if(battery.guideKey!==k)return;if(!g.suggestion||typeof g.suggestion.message!=='string')throw new Error('嚮導回應格式不正確');battery.guide=g;battery.guideStatus='ok';}
  catch{if(battery.guideKey===k)battery.guideStatus='error';}
  updateBatteryViews();}

async function syncRecovery(record,prefix=''){const code=batteryCode();if(!code||!record||!D.isRecoverySkill(state,record.skillId))return false;

    toast(`${prefix}恢復行動已回報，生活電量 +${pct(r.recovered)}%`);}
  catch(e){toast(`${prefix}恢復紀錄已保存在本機；${e.message}，電量未更新。`);}
  battery.inflight=false;await refreshBattery();return true;}

function chart(sc,days=range,interactive=true){const end=D.day(D.now()),dates=Array.from({length:days},(_,i)=>D.day(D.dayStart(end)-(days-1-i)*86400));const all=Object.keys(sc.days).sort();if(!all.length)return `<div class="empty">${I('growth')}<p>你的第一條軌跡，從一筆行動開始。</p><p class="small">這裡不會放入假進步；紀錄後就能回看。</p></div>`;

function growthPage(){const sc=score(),today=D.dayStart(D.day(D.now())),start=today-(range-1)*86400,valid=state.sessions.filter(r=>!r.voidedAt);const phaseEvents=state.goals.flatMap(g=>g.checkpoints.filter(c=>c.completedAt&&Date.parse(c.completedAt)/1000>=start).map(c=>({g,c}))).sort((a,b)=>Date.parse(b.c.completedAt)-Date.parse(a.c.completedAt));const inDays=Object.values(sc.days).filter(d=>D.dayStart(d.localDate)>=start);const timed=inDays.reduce((n,d)=>n+d.focusSeconds,0);const bars=D.DOMAINS.map(d=>({d,seconds:D.activities(state).filter(a=>D.skillMeta(state,a.skillId).domainId===d.id&&D.dayStart(a.localDate)>=start).reduce((n,a)=>n+a.focusSeconds,0)}));const barMax=Math.max(...bars.map(x=>x.seconds),1);

function characterPage(){const sc=score(),p=sc.character,valid=state.sessions.filter(r=>!r.voidedAt),weekStart=D.dayStart(D.day(D.now()))-((new Date((D.now()+28800)*1000).getUTCDay()+6)%7)*86400;const weeks=new Map();for(const a of D.activities(state)){const t=D.dayStart(a.localDate),w=t-((new Date((t+28800)*1000).getUTCDay()+6)%7)*86400;if(!weeks.has(w))weeks.set(w,new Set());weeks.get(w).add(a.localDate);}const hasThreeDayWeek=[...weeks.values()].some(ds=>ds.size>=3);const achievements=[{name:'踏出第一步',sub:'第一筆有效紀錄',icon:'compass',ok:valid.length>0},{name:'三日行動',sub:'同一週三個不同紀錄日',icon:'spark',ok:hasThreeDayWeek},{name:'首個里程碑',sub:'確認一個成果關卡',icon:'trophy',ok:state.goals.some(g=>g.checkpoints.some(c=>c.completedAt))}];
return `<section class="profile-hero"><div class="between"><div class="row" style="gap:20px"><div class="avatar">${I('compass')}</div><div><div class="eyebrow">YOUR CHARACTER</div><h2 style="margin:6px 0">${esc(state.player.name)}</h2><span class="small muted">記錄行動的冒險者 · Lv. ${p.level}</span></div></div>${button(I('edit'),'edit-name','aria-label="修改玩家名稱"','ghost icononly')}</div><div class="progress" style="margin:25px 0 10px"><span style="width:${p.progress*100}%"></span></div><div class="between small muted"><span>${p.xpIntoLevel} / ${p.nextLevelXP-p.levelStartXP} XP</span><span>累積 ${p.totalXP} XP · 距下一級 ${p.xpToNextLevel} XP</span></div>${batteryBar()}</section><div class="profile-grid"><section class="card"><div class="card-title"><h3>正在練習的技能</h3>${button('探索技能樹 '+I('arrow'),'nav','data-tab="skills"','ghost')}<p class="small muted">記錄練習，不推定精通。</p></div>${Object.entries(sc.skillLevels).map(([id,p])=>`<div style="margin:20px 0"><div class="between small"><b>${esc(D.skillMeta(state,id).name)}</b><span class="muted">Lv. ${p.level} · ${p.totalXP} XP</span></div><div class="progress" style="height:5px;margin-top:10px"><span style="width:${p.progress*100}%"></span></div></div>`).join('')||'<div class="empty small">記錄第一段專注後，你的技能會出現在這裡。</div>'}<div class="divider"></div><h3 style="margin-bottom:17px">旅程徽章</h3><div class="badge-grid">${achievements.map(a=>`<div class="badge ${a.ok?'earned':''}">${I(a.icon)}<b>${a.name}</b><p>${a.ok?'已達成':a.sub}</p></div>`).join('')}</div></section><section class="card"><h3 style="margin-bottom:18px">旅程設定與資料</h3><div class="setting-row"><div><h3>戰鬥畫面</h3><p>不影響 XP，可隨時切換。</p></div><select id="scene-setting" aria-label="預設戰鬥畫面" style="width:130px;font-size:11px"><option value="dynamic" ${state.preferences.scene==='dynamic'?'selected':''}>動態戰鬥</option><option value="static" ${state.preferences.scene==='static'?'selected':''}>靜態場景</option><option value="minimal" ${state.preferences.scene==='minimal'?'selected':''}>純計時器</option></select></div><div class="setting-row"><div><h3>生活電量連結</h3><p>${battery.code?'已連結 · 只讀取電量與回報恢復時數':'貼上生活電量計的連結碼'}</p></div>${button(I('spark')+(battery.code?'管理':'設定'),'battery-link')}</div><div class="setting-row"><div><h3>匯出旅程</h3><p>JSON 包含目標、紀錄與備註。</p></div>${button(I('export')+'匯出','export')}</div><div class="setting-row"><div><h3>還原旅程</h3><p>預覽後取代目前資料，不合併。</p></div>${button(I('restore')+'還原','import')}</div><div class="setting-row"><div><h3>${mode==='demo'?'返回正式旅程':'體驗示範世界'}</h3><p>示範與正式資料完全分開。</p></div>${button(I('eye')+'切換','mode')}</div><div class="setting-row"><div><h3>安裝到主畫面</h3><p>上線後可依瀏覽器支援安裝。</p></div><button class="btn" data-act="install-pwa">安裝</button></div><div class="notice" style="margin-top:18px">v0.6 Web App · 單人、本機儲存 · 台北時區。<br>沒有帳號、雲端同步或資料加密。清除瀏覽器資料可能失去紀錄，請定期匯出。<br>連結生活電量時，只會送出連結碼、恢復行動的時數與進行中的目標名稱。${location.protocol==='file:'?'<br><b>目前直接開啟 HTML。不同檔案路徑可能有不同儲存區；長期試用請使用資料包的本機啟動器。</b>':''}</div></section></div>`;}
function sceneButtons(){return `<div class="scene-toggle" aria-label="戰鬥畫面模式">${[['dynamic','動態'],['static','靜態'],['minimal','純計時']].map(([id,label])=>`<button data-act="scene" data-scene="${id}" class="${state.preferences.scene===id?'active':''}" aria-pressed="${state.preferences.scene===id}">${label}</button>`).join('')}</div>`;}
const MODE_LABELS={countdown:'倒數專注',countup:'正計時 · 木樁訓練',pomodoro:'番茄鐘'};
function timerMessage(a,v) {
  if(a.state==='review')return a.endedByLimit?'已達單次紀錄上限，請確認並儲存':'本次專注已結束，請確認並儲存';

  if(a.state==='break')return `休息中 · 已完成 ${a.completedRounds} 回合，休息不計 XP`;
  if(a.state==='ready')return '休息結束 · 準備好再開始下一回合';
  if(v.mode==='countup')return '自由練習中 · 沒有血量，不需要倒數';
  return v.mode==='pomodoro'?`第 ${a.round} 回合 · 專注結束後自動休息`:'專注中 · 角色正在替你戰鬥';
}
function hpCaption(a,v) {

  return `依本回合 ${minutes(v.target)} 分鐘扣血，不用設定 HP`;
}

function render(){

  }
}

const templates={app:{title:'完成我的第一個 App',domainId:'creation',skillId:D.T.defaults.creation,boss:'星核鍛造者',nextAction:'完成首頁的基本操作',checkpoints:'完成可以操作的版本\n完成一次實際試用\n根據回饋發布修正版'},study:{title:'完成本次課程複習',domainId:'learning',skillId:'learning.subjects.physiological_psych',boss:'知識石像',nextAction:'整理第一個章節的重點',checkpoints:'完成各章重點整理\n完成一回自我練習\n釐清練習中的問題'},english:{title:'完成一分鐘英文自我介紹',domainId:'language',skillId:D.T.skills.find(k=>k.name==='英文口說').id,boss:'語音龍',nextAction:'練習開場的三句話',checkpoints:'完成一分鐘講稿\n完成一次錄音與回聽\n完成最終展示'}};

case 'discard':{const id=state.active.id;openModal('捨棄未儲存的回合？',`<p class="small muted">只捨棄這次尚未保存的時間，不會刪除過去紀錄，也不扣既有 XP。</p><div class="form-actions">${button('返回結算','review-again')}${button('確認捨棄','discard-confirm',`data-id="${id}"`,'danger')}</div>`);break;}
case 'discard-confirm':await mutate(s=>D.discard(s,b.dataset.id));closeModal();tab='today';recovered=false;render();toast('本次回合已捨棄，既有紀錄保留。');break;
case 'review-again':reviewForm();break;
case 'scene':await mutate(s=>{s.preferences.scene=b.dataset.scene;});break;
case 'manual':manualForm(b.dataset.goal);break;
case 'checkpoint':milestoneForm(b.dataset.goal,b.dataset.checkpoint);break;
case 'record':recordModal(b.dataset.id);break;
case 'void-confirm':openModal('撤銷這筆紀錄？',`<p class="small muted">原始紀錄會保留更正軌跡，但不再計入有效時間、XP 或成長圖。等級可能因更正而調整。</p><div class="form-actions">${button('返回','record',`data-id="${b.dataset.id}"`)}${button('確認撤銷','void',`data-id="${b.dataset.id}"`,'danger')}</div>`);break;
case 'void':await mutate(s=>D.voidSession(s,b.dataset.id));closeModal();render();toast('紀錄已更正；XP、等級與成長圖已重新計算。');break;
case 'goal-status':{const gid=b.dataset.goal,status=b.dataset.status;openModal(status==='archived'?'封存這個人生目標？':status==='paused'?'暫停這個人生目標？':'恢復這個人生目標？',`<p class="small muted">既有時間、成果與 XP 都會保留。改變目標方向不是失敗。</p><div class="form-actions">${button('取消','close-modal')}${button('確認','status-confirm',`data-goal="${gid}" data-status="${status}"`,'primary')}</div>`);break;}
case 'status-confirm':await mutate(s=>D.setGoalStatus(s,b.dataset.goal,b.dataset.status));closeModal();render();toast('目標狀態已更新。');break;
case 'day-records':{const d=b.dataset.date,sc=score(),rows=state.sessions.filter(r=>!r.voidedAt&&D.splitDays(r.segments).some(([date])=>date===d));openModal(d+' 的來源紀錄',`<p class="small muted">當日 ${minutes(sc.days[d]?.focusSeconds||0)} 分鐘 · +${sc.days[d]?.awardedXP||0} XP</p>${sessionList(rows,sc)}<p class="field-help">跨日回合在清單中顯示整筆時段；此處的當日總值只計當天部分。</p>`);break;}
case 'edit-name':openModal('修改玩家名稱',`<form id="name-form" class="form-grid"><label>名稱<input name="name" value="${esc(state.player.name)}" maxlength="40" required></label><button type="submit" class="btn primary">儲存名稱</button></form>`);break;
case 'export':await exportData();break;
case 'battery-link':batteryForm();break;
case 'battery-demo':setAutoLink(true);await mutate(s=>{D.setBatteryLink(s,'demo-session');});closeModal();render();toast('已套用示範電量。');await refreshBattery();break;
case 'battery-unlink':setAutoLink(false);await mutate(s=>{D.setBatteryLink(s,'');});closeModal();render();toast('已取消生活電量連結。');await refreshBattery();break;
case 'guide-refresh':await refreshGuide(true);break;
case 'quiz-open':await quizForm();break;
case 'quiz-later':try{sessionStorage.setItem(QUIZ_LATER,'1');}catch{}closeModal();toast('之後可以從冒險大廳的 AI 嚮導開始快篩。');break;

}}catch(err){error(err);}});
document.addEventListener('submit',async e=>{if(!e.target.closest('#modal'))return;e.preventDefault();if(busy)return;const form=e.target,v=Object.fromEntries(new FormData(form)),old=score().totalXP;try{if(form.id==='goal-form'){const g=await mutate(s=>D.createGoal(s,{...v,skillId:resolveSubject(s,v),nextAction:v.nextAction.trim()||v.title,checkpoints:v.checkpoints.trim()?v.checkpoints.split('\n'):['完成「'+v.title+'」']}));selected=g.id;tab='detail';closeModal();render();toast('人生章節已建立。現在就能開始第一場專注戰鬥。');}
else if(form.id==='focus-form'){await mutate(s=>{rememberFocus(s,v);return D.start(s,focusOptions(v,false,s));});closeModal();tab='battle';recovered=false;render();window.scrollTo(0,0);}
else if(form.id==='review-form'){const id=v.sessionId;await mutate(s=>{if(s.sessions.some(r=>r.id===id))return;D.reviewTrim(s,id,Number(v.keepSeconds));return D.save(s,id,v.note);});const gained=score().totalXP-old;closeModal();recovered=false;tab='today';render();syncRecovery(state.sessions.find(r=>r.id===id));openModal('這一步，已寫進你的旅程',`<div style="text-align:center;padding:10px 0"><div class="avatar" style="width:65px;height:65px;margin:0 auto 15px">${I('spark','big')}</div><h2>+${gained} XP</h2><p class="small muted" style="margin:12px 0">本次投入已儲存。成果關卡仍由你確認，<br>不會因為計時結束就自動完成。</p></div><div class="form-actions">${button('返回大廳','close-modal')}${button('查看成長軌跡 '+I('arrow'),'saved-growth','','primary')}</div>`);}
else if(form.id==='manual-form'){const start=Date.parse(v.start+':00+08:00')/1000,end=Date.parse(v.end+':00+08:00')/1000;const record=await mutate(s=>D.manual(s,{...v,skillId:resolveSubject(s,v),start,end}));closeModal();render();const msg=`補登已儲存 · +${score().totalXP-old} XP。`;toast(msg);syncRecovery(record,msg);}
else if(form.id==='checkpoint-form'){await mutate(s=>D.checkpoint(s,v.goalId,v.checkpointId,v.done==='true',v.note||''));closeModal();render();toast(v.done==='true'?'成果已確認，Boss 關卡已更新。':'成果狀態已更正，專注紀錄保留。');}
else if(form.id==='edit-goal-form'){await mutate(s=>{D.updateGoal(s,v.goalId,v);s.preferences.subjectByGoal[v.goalId]=resolveSubject(s,v);});closeModal();render();toast('目標已更新，原始紀錄與 XP 保留。');}
else if(form.id==='subject-form'){await mutate(s=>{const id=resolveSubject(s,v);if(!s.preferences.pinnedSkills.includes(id))s.preferences.pinnedSkills.push(id);});closeModal();skillFilter='pinned';tab='skills';render();toast('科目已保存，下次專注可以直接選用。');}
else if(form.id==='quiz-form'){const answers=(quizQuestions||[]).map((_,i)=>Number(v['q'+i]));
  if(!answers.length||answers.some(n=>!Number.isInteger(n)))throw new Error('請回答全部題目');
  const res=await fetch('/api/onboarding',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({answers})});
  const body=await res.json().catch(()=>null);if(!res.ok||!body?.profile)throw new Error(typeof body?.error==='string'?body.error:'快篩儲存失敗，請稍後再試');
  setAutoLink(true);closeModal();toast(`你的基礎電量是 ${pct(body.profile.baseBatteryCapacity)}%。${typeof body.profile.summary==='string'?body.profile.summary:''}`);
  battery.inflight=false;await refreshBattery();}
else if(form.id==='battery-form'){await mutate(s=>{D.setBatteryLink(s,v.code);});closeModal();render();toast(v.code.trim()?'電量連結碼已儲存。':'已取消生活電量連結。');await refreshBattery();}
else if(form.id==='name-form'){await mutate(s=>{s.player.name=v.name.trim();});closeModal();render();toast('玩家名稱已更新。');}
}catch(err){error(err);}});
document.addEventListener('click',e=>{if(e.target.closest('[data-act="saved-growth"]')){closeModal();tab='growth';render();window.scrollTo(0,0);}});
document.addEventListener('input',e=>{if(e.target.matches('#review-form input[name="keepSeconds"]')){try{const a=state.active,copy=D.clone(state),n=Number(e.target.value);D.reviewTrim(copy,a.id,n);D.save(copy,a.id,'');$('#review-duration').textContent=fmt(n);$('#review-xp').textContent='+'+(D.score(copy).totalXP-score().totalXP)+' XP';}catch{if($('#review-xp'))$('#review-xp').textContent='待確認';}}});
document.addEventListener('change',async e=>{try{if(e.target.id==='scene-setting')await mutate(s=>s.preferences.scene=e.target.value);
if(e.target.matches('#goal-form select[name="domainId"]')){const d=D.DOMAINS.find(d=>d.id===e.target.value),f=$('#goal-form');setPicker(f.querySelector('.skill-picker'),D.T.defaults[d.id]);f.elements.boss.value=d.boss;}
if(e.target.matches('#manual-form select[name="goalId"]'))setPicker($('#manual-form .skill-picker'),D.goal(state,e.target.value).skillId);
const picker=e.target.closest('.subject-picker');if(picker&&e.target.name==='subjectGroup')updateSubjectPicker(picker,false);
}catch(err){error(err);}});
document.addEventListener('input',e=>{if(e.target.name==='subjectName')updateSubjectPicker(e.target.closest('.subject-picker'));if(e.target.closest('#focus-form'))updateFocusSetup();if(e.target.id==='skill-search'){skillQuery=e.target.value;$('#skill-results').innerHTML=skillResults();}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('circle[data-act]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}});
modal.addEventListener('click',e=>{if(e.target===modal){const r=modal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal();}});
async function tick(){
  if(!state?.active)return;
  const a=state.active;
  if(D.needsAdvance(a)&&!busy){
    try{await mutate(s=>{if(s.active?.id===a.id)D.advance(s,a.id);});
      if(state.active?.state==='review')toast('本次專注結束，請確認並儲存。');
      else if(state.active?.state==='break')toast('這回合已完成。休息一下，休息不計入專注。');
      else if(state.active?.state==='ready')toast('休息結束，準備好再開始下一回合。');
    }catch(err){error(err);}return;
  }
  const v=D.timerView(a),hp=D.battleProgress(state,a.goalId);
  if($('#focus-timer'))$('#focus-timer').textContent=fmt(v.displaySeconds);
  if($('#focus-state'))$('#focus-state').textContent=timerMessage(a,v);
  if($('#battle-elapsed'))$('#battle-elapsed').textContent=fmt(v.total);
  if($('#boss-hp'))$('#boss-hp').textContent=Math.ceil(hp.hp)+'%';
  if($('#boss-hp-fill'))$('#boss-hp-fill').style.width=100*hp.ratio+'%';
  if($('#boss-hp-track'))$('#boss-hp-track').setAttribute('aria-valuenow',Math.ceil(hp.hp));
  if($('#hp-caption'))$('#hp-caption').textContent=hpCaption(a,v);
  document.querySelectorAll('[data-active-elapsed]').forEach(x=>x.textContent=fmt(v.total));
}


if(channel)channel.onmessage=async e=>{if(e.data.mode!==mode||busy)return;try{const incoming=await store.read(mode);if(incoming&&incoming.revision>state.revision){state=incoming;refreshBattery();if(!modal.open)render();else toast('資料在另一個分頁已更新；提交時會再次檢查。');}}catch(e){error(e);}};
document.addEventListener('visibilitychange',()=>{if(!document.hidden){tick();refreshBattery();}});
window.addEventListener('focus',()=>refreshBattery());
try{await store.open();state=await store.read(mode);if(!state)state=(await store.update(mode,()=>{},factory)).state;D.validate(state);recovered=!!state.active;render();setInterval(tick,1000);refreshBattery();setInterval(()=>{if(!document.hidden)refreshBattery();},60000);}catch(e){app.innerHTML=`<main class="fatal card"><h1>暫時無法開啟本機旅程</h1><p>${esc(e.message)}</p><p class="small muted">請確認使用一般瀏覽模式並允許網站儲存資料。也可以使用資料包的本機啟動器；不要直接清除現有資料庫。</p><button class="btn primary" onclick="location.reload()">重試</button></main>`;console.error(e);}
// Read-only diagnostic hook for reproducible automated tests; no network access.
window.LifeRPGDebug={snapshot:()=>state?D.clone(state):null,project:()=>D.score(state),view:()=>({tab,mode})};
})();
